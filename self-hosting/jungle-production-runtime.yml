services:
  openpanel-api:
    healthcheck:
      # A cold image runs database migrations before the API starts listening.
      # Keep Compose waiting instead of declaring a healthy release dead early.
      start_period: 120s
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      AI_MODEL: ${AI_MODEL:?}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:?}
      CLICKHOUSE_SETTINGS: ${CLICKHOUSE_SETTINGS:?}
