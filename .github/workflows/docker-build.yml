name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    paths-ignore:
      # README and docs
      - "**/README*"
      - "**/readme*"
      - "**/*.md"
      - "**/docs/**"
      - "**/CHANGELOG*"
      - "**/LICENSE*"
      # Test files
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/__tests__/**"
      - "**/tests/**"
      # SDKs (published separately)
      - "packages/sdks/**"
      # Public app (docs/marketing, not part of Docker deploy)
      - "apps/public/**"
      # Dev / tooling
      - "**/.vscode/**"
      - "**/.cursor/**"
      - "**/.env.example"
      - "**/.env.*.example"
      - "**/.gitignore"
      - "**/.eslintignore"
      - "**/.prettierignore"

permissions:
  contents: read

concurrency:
  group: openpanel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  repo_owner: "jungle-learning"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.1.3.52
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: openpanel
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production deployment script
        run: |
          bash -n scripts/deploy-openpanel-production.sh
          bash -n scripts/prefetch-openpanel-production-images.sh
          bash scripts/deploy-openpanel-production.test.sh

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Codegen
        run: pnpm codegen

      - name: Migrate database
        run: pnpm migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:8123/openpanel
          SELF_HOSTED: "true"

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:8123/openpanel
          REDIS_URL: redis://localhost:6379

      # - name: Run Biome
      #   run: pnpm lint

      # - name: Run TypeScript checks
      #   run: pnpm typecheck

  build-api:
    permissions:
      packages: write
      contents: read
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=api-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=api-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/api,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
            OPENPANEL_RELEASE_SHA=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-api-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    permissions:
      packages: write
      contents: write
    needs: build-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-api-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          printf 'image_tag=%s-%s\n' "${branch_name:0:80}" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          digest_references=()
          for digest_file in *; do
            digest_references+=("ghcr.io/${{ env.repo_owner }}/api@sha256:${digest_file}")
          done
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/api:${{ steps.tags.outputs.image_tag }} \
            "${digest_references[@]}"

      - name: Create/Update API tag
        if: github.ref == 'refs/heads/main'
        run: |
          # Delete existing tag if it exists
          if git tag -l "api" | grep -q "api"; then
            git tag -d "api"
            echo "Deleted local tag: api"
          fi

          # Create new tag
          git tag "api" "${{ github.sha }}"
          echo "Created tag: api"

          # Push tag to remote
          git push origin "api" --force
          echo "Pushed tag: api"

  build-worker:
    permissions:
      packages: write
      contents: read
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=worker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=worker-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/worker,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
            OPENPANEL_RELEASE_SHA=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-worker-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-worker:
    permissions:
      packages: write
      contents: write
    needs: build-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-worker-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          printf 'image_tag=%s-%s\n' "${branch_name:0:80}" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          digest_references=()
          for digest_file in *; do
            digest_references+=("ghcr.io/${{ env.repo_owner }}/worker@sha256:${digest_file}")
          done
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/worker:${{ steps.tags.outputs.image_tag }} \
            "${digest_references[@]}"

      - name: Create/Update Worker tag
        if: github.ref == 'refs/heads/main'
        run: |
          # Delete existing tag if it exists
          if git tag -l "worker" | grep -q "worker"; then
            git tag -d "worker"
            echo "Deleted local tag: worker"
          fi

          # Create new tag
          git tag "worker" "${{ github.sha }}"
          echo "Created tag: worker"

          # Push tag to remote
          git push origin "worker" --force
          echo "Pushed tag: worker"

  build-dashboard:
    permissions:
      packages: write
      contents: read
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/start/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=dashboard-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/dashboard,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NO_CLOUDFLARE=1
            OPENPANEL_RELEASE_SHA=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-dashboard-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-dashboard:
    permissions:
      packages: write
      contents: write
    needs: build-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-dashboard-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          printf 'image_tag=%s-%s\n' "${branch_name:0:80}" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          digest_references=()
          for digest_file in *; do
            digest_references+=("ghcr.io/${{ env.repo_owner }}/dashboard@sha256:${digest_file}")
          done
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/dashboard:${{ steps.tags.outputs.image_tag }} \
            "${digest_references[@]}"

      - name: Create/Update Dashboard tag
        if: github.ref == 'refs/heads/main'
        run: |
          # Delete existing tag if it exists
          if git tag -l "dashboard" | grep -q "dashboard"; then
            git tag -d "dashboard"
            echo "Deleted local tag: dashboard"
          fi

          # Create new tag
          git tag "dashboard" "${{ github.sha }}"
          echo "Created tag: dashboard"

          # Push tag to remote
          git push origin "dashboard" --force
          echo "Pushed tag: dashboard"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    needs:
      - merge-api
      - merge-worker
      - merge-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure production image prefetch access
        env:
          OPENPANEL_PREFETCH_KNOWN_HOSTS: ${{ secrets.OPENPANEL_PREFETCH_KNOWN_HOSTS }}
          OPENPANEL_PREFETCH_SSH_PRIVATE_KEY: ${{ secrets.OPENPANEL_PREFETCH_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/openpanel-prefetch-key"
          printf '%s\n' "$OPENPANEL_PREFETCH_SSH_PRIVATE_KEY" > "${RUNNER_TEMP}/openpanel-prefetch-key"
          install -m 600 /dev/null "${RUNNER_TEMP}/openpanel-known-hosts"
          printf '%s\n' "$OPENPANEL_PREFETCH_KNOWN_HOSTS" > "${RUNNER_TEMP}/openpanel-known-hosts"

      - name: Deploy and verify production
        run: bash scripts/deploy-openpanel-production.sh
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PULL_USERNAME: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          OPENPANEL_API_HEALTH_URL: https://op-api.jungleai.com/healthcheck
          OPENPANEL_DASHBOARD_HEALTH_URL: https://analytics.jungleai.com/api/healthcheck
          OPENPANEL_KNOWN_HOSTS_PATH: ${{ runner.temp }}/openpanel-known-hosts
          OPENPANEL_PREFETCH_HOST: ${{ vars.OPENPANEL_PREFETCH_HOST }}
          OPENPANEL_PREFETCH_SSH_KEY_PATH: ${{ runner.temp }}/openpanel-prefetch-key
          OPENPANEL_PREFETCH_USER: ${{ vars.OPENPANEL_PREFETCH_USER }}
