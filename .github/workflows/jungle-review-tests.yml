name: Jungle Review tests

on:
  pull_request:
    paths:
      - '.github/jungle_review/**'
      - '.github/workflows/jungle-review*.yml'
      - 'scripts/*jungle_review*.py'
      - 'scripts/*pr_review_eval*.py'
  push:
    paths:
      - '.github/jungle_review/**'
      - '.github/workflows/jungle-review*.yml'
      - 'scripts/*jungle_review*.py'
      - 'scripts/*pr_review_eval*.py'

permissions:
  contents: read

jobs:
  test:
    name: Jungle Review tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # This unprivileged job executes candidate tests. No provider or repository
      # write credentials are present, unlike the base-branch review workflow.
      - run: python -m unittest discover -s .github/jungle_review -p 'test_*.py' -v
      - name: Check the canonical evaluation and rollout tools when present
        run: |
          if [ -f scripts/test_pr_review_eval.py ]; then
            python -m unittest discover -s scripts -p 'test_pr_review_eval.py' -v
          fi
          if [ -f scripts/test_install_jungle_review.py ]; then
            python -m unittest discover -s scripts -p 'test_install_jungle_review.py' -v
          fi
          if [ -f scripts/test_provision_jungle_review.py ]; then
            python -m unittest discover -s scripts -p 'test_provision_jungle_review.py' -v
          fi
