name: Jungle Review tests

on:
  pull_request:
    paths:
      - '.github/jungle_review/**'
      - '.github/workflows/jungle-review*.yml'
      - 'scripts/*jungle_review*.py'
      - 'scripts/*pr_review_eval*.py'
  push:
    paths:
      - '.github/jungle_review/**'
      - '.github/workflows/jungle-review*.yml'
      - 'scripts/*jungle_review*.py'
      - 'scripts/*pr_review_eval*.py'

permissions:
  contents: read

jobs:
  test:
    name: Jungle Review tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact test commit without submodule initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR jobs receive the merge commit; push jobs receive the pushed commit.
          # Never persist the read token or run submodule cleanup on legacy gitlinks.
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GH_TOKEN
          git sparse-checkout set --no-cone '/.github/jungle_review/' '/.github/workflows/' '/scripts/'
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # This unprivileged job executes candidate tests. No provider or repository
      # write credentials are present, unlike the base-branch review workflow.
      - run: python -m unittest discover -s .github/jungle_review -p 'test_*.py' -v
      - name: Check the canonical evaluation and rollout tools when present
        run: |
          if [ -f scripts/test_pr_review_eval.py ]; then
            python -m unittest discover -s scripts -p 'test_pr_review_eval.py' -v
          fi
          if [ -f scripts/test_install_jungle_review.py ]; then
            python -m unittest discover -s scripts -p 'test_install_jungle_review.py' -v
          fi
          if [ -f scripts/test_provision_jungle_review.py ]; then
            python -m unittest discover -s scripts -p 'test_provision_jungle_review.py' -v
          fi
